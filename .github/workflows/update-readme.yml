name: Update README

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No README changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            git fetch origin "${BRANCH_NAME}"
            git reset --hard "origin/${BRANCH_NAME}"
            python scripts/generate_readme.py
            if git diff --quiet; then
              echo "No README changes after syncing."
              exit 0
            fi
            git add README.md
            git commit -m "chore: update dynamic README"
            if git push origin "HEAD:${BRANCH_NAME}"; then
              exit 0
            fi
            echo "Push failed due to concurrent updates. Retrying (${attempt}/3)..."
            sleep 1
          done
          echo "Failed to push README updates after 3 attempts."
          exit 1
